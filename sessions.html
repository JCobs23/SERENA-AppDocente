<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Serena | Sesión de aula</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="sessions.js" defer></script>
  </head>
  <body>
    <main class="login-page">
      <section class="login session-page" aria-labelledby="brand-title">
        <header class="brand">
          <h1 id="brand-title">Serena</h1>
          <p>Sesión de aula · Conexión con estudiantes</p>
        </header>
        <section class="login-card">
          <label for="server-url">Dirección del servidor</label>
          <input id="server-url" type="url" value="http://localhost:5080" autocomplete="url" />
          <button class="submit-button" id="create-session" type="button">Crear sesión</button>
          <div class="session-code-box" id="session-result" hidden>
            <p>Código para compartir con el grupo</p>
            <output id="session-code">------</output>
            <button class="secondary-button" id="refresh-students" type="button">Actualizar estudiantes</button>
            <p class="student-count" id="student-count">Aún no se han conectado estudiantes.</p>
            <ul id="student-list"></ul>
          </div>
          <p class="form-message" id="session-message" role="status" aria-live="polite"></p>
          <p class="privacy-note">Modo de integración local. Usa esta pantalla solo en una red de pruebas.</p>
        </section>
      </section>
    </main>
  </body>
</html>
